<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Web CTF Playbook social preview</title>
  <desc id="desc">Scenario-first Web CTF playbook for authorized practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06101d"/>
      <stop offset="58%" stop-color="#0b1b31"/>
      <stop offset="100%" stop-color="#16132b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="36" fill="url(#bg)"/>
  <circle cx="1130" cy="86" r="170" fill="#38bdf8" opacity="0.10"/>
  <circle cx="132" cy="590" r="190" fill="#a78bfa" opacity="0.10"/>
  <rect x="72" y="72" width="1136" height="496" rx="28" fill="#020617" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="72" y="72" width="1136" height="10" rx="5" fill="url(#accent)"/>
  <text x="126" y="166" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="3">WEB CTF PLAYBOOK</text>
  <text x="126" y="238" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="48" font-weight="700">From entry point to exploit chain.</text>
  <text x="126" y="288" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="26">Scenario-first routing, minimal validation, searchable references.</text>
  <g font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">
    <rect x="126" y="338" width="188" height="52" rx="26" fill="#0f766e" opacity="0.85"/>
    <text x="220" y="371" fill="#ecfeff" text-anchor="middle">8 modules</text>
    <rect x="330" y="338" width="212" height="52" rx="26" fill="#1d4ed8" opacity="0.85"/>
    <text x="436" y="371" fill="#eff6ff" text-anchor="middle">33 chapters</text>
    <rect x="558" y="338" width="230" height="52" rx="26" fill="#7c3aed" opacity="0.85"/>
    <text x="673" y="371" fill="#f5f3ff" text-anchor="middle">12 recipes</text>
  </g>
  <g transform="translate(126 432)">
    <rect x="0" y="0" width="870" height="86" rx="16" fill="#0f172a" stroke="#1e293b"/>
    <circle cx="28" cy="28" r="6" fill="#fb7185"/>
    <circle cx="50" cy="28" r="6" fill="#fbbf24"/>
    <circle cx="72" cy="28" r="6" fill="#34d399"/>
    <text x="28" y="65" fill="#e2e8f0" font-family="Consolas, monospace" font-size="21">$ node scripts/search-notes.mjs gopher</text>
    <rect x="540" y="54" width="302" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
  </g>
  <text x="1150" y="548" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="19" text-anchor="end">CTF · lab · authorized testing only</text>
</svg>

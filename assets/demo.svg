<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Web CTF Playbook terminal demo</title>
  <desc id="desc">A terminal shows search commands for gopher, deserialization, list, and stats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0d1b2f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .line { opacity: 0; animation: fade 0.01s forwards; }
      .l1 { animation-delay: 0.25s; }
      .l2 { animation-delay: 0.65s; }
      .l3 { animation-delay: 1.05s; }
      .l4 { animation-delay: 1.45s; }
      .l5 { animation-delay: 1.85s; }
      .l6 { animation-delay: 2.25s; }
      .l7 { animation-delay: 2.65s; }
      .l8 { animation-delay: 3.05s; }
      .l9 { animation-delay: 3.45s; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes fade { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="960" height="540" rx="30" fill="url(#bg)"/>
  <circle cx="88" cy="72" r="34" fill="#38bdf8" opacity="0.12"/>
  <circle cx="868" cy="462" r="110" fill="#a78bfa" opacity="0.10"/>
  <rect x="54" y="46" width="852" height="448" rx="22" fill="#020617" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="54" y="46" width="852" height="52" rx="22" fill="#0f172a"/>
  <rect x="54" y="76" width="852" height="22" fill="#0f172a"/>
  <circle cx="88" cy="72" r="7" fill="#fb7185"/>
  <circle cx="112" cy="72" r="7" fill="#fbbf24"/>
  <circle cx="136" cy="72" r="7" fill="#34d399"/>
  <text x="170" y="78" fill="#94a3b8" font-family="Consolas, monospace" font-size="16">web-ctf-playbook — terminal</text>
  <rect x="70" y="116" width="820" height="4" rx="2" fill="url(#glow)" opacity="0.75"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="19">
    <g class="line l1"><text x="86" y="164" fill="#38bdf8">$</text><text x="112" y="164" fill="#e2e8f0">node scripts/search-notes.mjs gopher</text></g>
    <g class="line l2"><text x="112" y="194" fill="#94a3b8">02-sqli-ssrf-and-protocols.md:218:</text><text x="468" y="194" fill="#f8fafc">gopher://...</text></g>
    <g class="line l3"><text x="86" y="238" fill="#38bdf8">$</text><text x="112" y="238" fill="#e2e8f0">node scripts/search-notes.mjs 反序列化 --context 2</text></g>
    <g class="line l4"><text x="112" y="268" fill="#94a3b8">05-php-and-pear.md:143:</text><text x="390" y="268" fill="#f8fafc">PHP 反序列化</text></g>
    <g class="line l5"><text x="86" y="312" fill="#38bdf8">$</text><text x="112" y="312" fill="#e2e8f0">node scripts/search-notes.mjs --list</text></g>
    <g class="line l6"><text x="112" y="342" fill="#94a3b8">01-rce-and-files.md</text></g>
    <g class="line l7"><text x="112" y="372" fill="#f8fafc">  💻 六、命令执行（RCE）</text></g>
    <g class="line l8"><text x="86" y="416" fill="#38bdf8">$</text><text x="112" y="416" fill="#e2e8f0">node scripts/search-notes.mjs --stats</text></g>
    <g class="line l9"><text x="112" y="446" fill="#a7f3d0">files=8 lines=4045 headings=202 chars=119565</text></g>
    <text x="112" y="480" fill="#38bdf8" class="cursor">█</text>
  </g>
  <text x="78" y="528" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="15">CTF · lab · authorized testing only</text>
  <text x="882" y="528" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="end">github.com/&lt;owner&gt;/web-ctf-playbook</text>
</svg>
